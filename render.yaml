services:
  - type: web
    name: statrush-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VALID_API_KEYS_RAW
        sync: false
